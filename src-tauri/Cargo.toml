[package]
name = "tagcast"
version = "0.1.0"
description = "TagCast - AI 播客元数据编辑器"
authors = ["whq"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
lofty = "0.22.2"
tauri-plugin-dialog = "2.7.1"
# 用 macOS 原生 TLS（Security 框架），避免 rustls/aws-lc 的 C 库编译拖慢构建
reqwest = { version = "0.13.3", default-features = false, features = ["json", "http2", "native-tls"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
dirs = "6.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSString", "NSURL", "NSError"] }
